[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "horuseye"
version = "2.4.0"
description = "Active Directory attack-path, exposure and remediation analysis"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Omar Tamer" }]
keywords = ["active-directory", "bloodhound", "sharphound", "pentest", "red-team",
            "blue-team", "security", "ctf", "attack-path", "adcs", "kerberoasting"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Systems Administration :: Authentication/Directory",
]
dependencies = ["rich>=13.0.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
ai = ["anthropic>=0.40"]

[project.urls]
Homepage = "https://omar-tamerr.github.io/HorusEye/"
Documentation = "https://github.com/Omar-tamerr/HorusEye#readme"
Repository = "https://github.com/Omar-tamerr/HorusEye"
Changelog = "https://github.com/Omar-tamerr/HorusEye/blob/main/CHANGELOG.md"
Issues = "https://github.com/Omar-tamerr/HorusEye/issues"

[project.scripts]
horuseye = "horuseye.cli:main"

[tool.setuptools.packages.find]
include = ["horuseye*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
