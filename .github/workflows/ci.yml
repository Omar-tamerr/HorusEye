name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.8", "3.11", "3.12", "3.13"]
        exclude:
          # Trim the matrix: one Python on Windows is enough to guard the
          # console-encoding regression; Linux covers the version spread.
          - os: windows-latest
            python-version: "3.8"
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.13"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

      - name: Smoke test (must not crash on a legacy console)
        run: |
          python horuseye.py --help
          python horuseye.py --check-deps
          horuseye --help

      - name: Smoke test (full analysis of the bundled lab)
        run: |
          horuseye --bloodhound examples/acme-lab --domain ACME.LAB --dc 10.10.0.5 --graph --owned JDOE@ACME.LAB --json smoke.json
          horuseye --bloodhound examples/acme-lab --domain ACME.LAB --dc 10.10.0.5 --graph --webapps examples/acme-lab-webapp/portal-confirmed.json
          horuseye --bloodhound examples/karnak-lab --certipy examples/karnak-lab/adcs/karnak_Certipy.json --domain KARNAK.LAB --dc 10.20.0.10 --explorer karnak.html --json karnak.json --csv karnak.csv
          horuseye --bloodhound examples/karnak-lab --certipy examples/karnak-lab/adcs/karnak_Certipy.json --domain KARNAK.LAB --dc 10.20.0.10 --diff karnak.json --fail-on exposure-up --fail-on new-route
